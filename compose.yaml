services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sinala}
      POSTGRES_USER: ${POSTGRES_USER:-sinala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: sinala-api:local
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["/usr/local/bin/migrate"]
    restart: "no"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-sinala}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-sinala}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: sinala-api:local
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["/usr/local/bin/api"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-sinala}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-sinala}?sslmode=disable"
      API_ADDR: ":3000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL: ${SESSION_TTL:-168h}
      TRUST_PROXY: "true"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
